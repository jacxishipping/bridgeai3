# ==============================================================================
#  AI Bridge — Production Multi-Container Orchestration Stack
# ==============================================================================
#  Orchestrates:
#   - Nginx (Hardened TLS 1.3, CSP, Rate Limiting, Reverse Proxy)
#   - Control Plane (Gunicorn 4-Worker Uvicorn Cluster)
#   - PostgreSQL 16 (High Performance Relational Storage with Connection Pooling)
#   - Redis 7 (Distributed Pub/Sub & Inter-Worker Synchronization)
#   - Certbot (Automated Let's Encrypt Certificate Renewal Daemon)
#
#  Env matrix (P-15, Wave 7): the control-api env keys are aligned with
#  render.yaml's ai-bridge-control service — same core keys, same
#  meaning. The full matrix (shared keys + intentional differences, e.g.
#  AI_BRIDGE_EMBED_MCP on Render only, inter-service hostnames and
#  container paths in compose only) is documented at the top of
#  render.yaml; do not add a key to one file without checking the other.
# ==============================================================================

services:
  control-api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.prod
    image: ai-bridge-control:production
    container_name: aibridge-control-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://ai_bridge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/ai_bridge
      - REDIS_URL=redis://redis:6379/0
      - AI_BRIDGE_ADMIN_TOKEN=${AI_BRIDGE_ADMIN_TOKEN:?Set AI_BRIDGE_ADMIN_TOKEN in .env}
      # F-05-02 (Wave 6): the CSRF HMAC secret MUST be one shared value
      # across all control-api replicas/workers — a per-process random
      # secret makes CSRF tokens minted on one worker fail on the others.
      # Required here (compose fails fast if unset); generate it with
      # deployment/linux/deploy-production.sh (openssl rand -hex 32).
      - AI_BRIDGE_CSRF_SECRET=${AI_BRIDGE_CSRF_SECRET:?Set AI_BRIDGE_CSRF_SECRET in .env}
      # F-05-05 (Wave 2A): the legacy shared admin token is OFF by
      # default — AI_BRIDGE_ADMIN_TOKEN alone does not enable it. The
      # operator opts in with AI_BRIDGE_ENABLE_LEGACY_ADMIN_TOKEN=1
      # (staging verification / bootstrap admin); production keeps the
      # session-based admin path. Passed through from .env, default 0.
      - AI_BRIDGE_ENABLE_LEGACY_ADMIN_TOKEN=${AI_BRIDGE_ENABLE_LEGACY_ADMIN_TOKEN:-0}
      # F-04-18 / F13-11 (EC2 WebRTC): the ice-servers endpoint mints
      # ephemeral TURN credentials from AI_BRIDGE_TURN_SECRET +
      # AI_BRIDGE_TURN_HOST. The secret was wired but the host was
      # never passed, so generate_ephemeral_turn_credentials raised
      # and the plane returned STUN-only — no relay path for
      # restrictive-NAT peers. The TURN server runs on this same host
      # (coturn, port 3478), so default the host to the plane domain;
      # an explicit AI_BRIDGE_TURN_HOST overrides it.
      - AI_BRIDGE_TURN_HOST=${AI_BRIDGE_TURN_HOST:-${AI_BRIDGE_DOMAIN:-jxiptvplayer.app}}
      # R-P0-15 follow-up (EC2 deploy): the production readiness check
      # (production_readiness.turn_credentials_configured, gated by
      # /health/ready) reads AI_BRIDGE_TURN_SECRET inside the control-api
      # process. The secret is generated by deploy-production.sh and
      # passed to coturn, but the control-api service never received
      # it, so a production deploy reported turn_secret_missing and
      # /health/ready stayed 503. Pass it here (compose fails fast
      # if unset).
      - AI_BRIDGE_TURN_SECRET=${AI_BRIDGE_TURN_SECRET:?Set AI_BRIDGE_TURN_SECRET in .env}
      - AI_BRIDGE_DATA_DIR=/var/lib/ai-bridge
      - AI_BRIDGE_WORKSPACE=/var/lib/ai-bridge/workspace
      - AI_BRIDGE_OAUTH_DB=/var/lib/ai-bridge/oauth/oauth.db
      - AI_BRIDGE_MCP_HOST=mcp-http
      - AI_BRIDGE_OAUTH_HOST=oauth-gateway
      # Tier 3 (shell/desktop control) is OFF by default (R-P0-14).
      # Explicit opt-in only: set it to 1 in .env.production to enable.
      - AI_BRIDGE_ALLOW_TIER3=${AI_BRIDGE_ALLOW_TIER3:-0}
      # Desktop automation is a separate gate from Tier 3: the agent
      # denies desktop tools (start_webrtc_stream, mouse/keyboard,
      # screenshots) unless desktop_enabled is true on BOTH sides, and
      # the plane reads it from AI_BRIDGE_DESKTOP_ENABLED (default 0).
      # The control-api never received this variable, so a WebRTC
      # session's start_webrtc_stream task failed with "Desktop
      # automation is not enabled" even with AI_BRIDGE_ALLOW_TIER3=1.
      # Pass it here (default 0/off); opt in with 1 in .env.production.
      - AI_BRIDGE_DESKTOP_ENABLED=${AI_BRIDGE_DESKTOP_ENABLED:-0}
      - AI_BRIDGE_DEVICE_TOKEN_TTL_DAYS=${AI_BRIDGE_DEVICE_TOKEN_TTL_DAYS:-7}
      - AI_BRIDGE_PUBLIC_URL=${AI_BRIDGE_PUBLIC_URL:-https://${AI_BRIDGE_DOMAIN:-jxiptvplayer.app}}
      # P-15 (Wave 7): env-matrix alignment with render.yaml — these keys
      # are set on the Render control service too (same names, same
      # meaning). PUBLIC_BASE_URL is the alias production_readiness.py
      # prefers; PROFILE=production gates the unsafe-anon refusal and
      # the readiness checks; CORS_ORIGINS / DASHBOARD_URL default to
      # this deployment's own domain (the dashboard is served by nginx
      # from the same host in compose, unlike Render's separate SPA).
      - AI_BRIDGE_PUBLIC_BASE_URL=${AI_BRIDGE_PUBLIC_BASE_URL:-https://${AI_BRIDGE_DOMAIN:-jxiptvplayer.app}}
      - AI_BRIDGE_PROFILE=${AI_BRIDGE_PROFILE:-production}
      - AI_BRIDGE_CORS_ORIGINS=${AI_BRIDGE_CORS_ORIGINS:-https://${AI_BRIDGE_DOMAIN:-jxiptvplayer.app}}
      - AI_BRIDGE_DASHBOARD_URL=${AI_BRIDGE_DASHBOARD_URL:-https://${AI_BRIDGE_DOMAIN:-jxiptvplayer.app}}
      - AI_BRIDGE_OIDC_ISSUER=${AI_BRIDGE_OIDC_ISSUER:-https://accounts.google.com}
      - AI_BRIDGE_OIDC_CLIENT_ID=${AI_BRIDGE_OIDC_CLIENT_ID:-}
      - AI_BRIDGE_OIDC_CLIENT_SECRET=${AI_BRIDGE_OIDC_CLIENT_SECRET:-}
      - AI_BRIDGE_OIDC_REDIRECT_URI=${AI_BRIDGE_OIDC_REDIRECT_URI:-}
      - AI_BRIDGE_OIDC_DASHBOARD_URL=${AI_BRIDGE_OIDC_DASHBOARD_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - aibridge-data:/var/lib/ai-bridge
    networks:
      - aibridge-network

  mcp-http:
    image: ai-bridge-control:production
    container_name: aibridge-mcp
    restart: always
    command: ["python", "-m", "ai_bridge.server", "--http", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - AI_BRIDGE_ADMIN_TOKEN=${AI_BRIDGE_ADMIN_TOKEN:?Set AI_BRIDGE_ADMIN_TOKEN in .env}
      - AI_BRIDGE_CONTROL_URL=http://control-api:8000
      - AI_BRIDGE_DATA_DIR=/var/lib/ai-bridge
      - AI_BRIDGE_WORKSPACE=/var/lib/ai-bridge/workspace
      - AI_BRIDGE_DISABLE_HOST_TOOLS=1
      - AI_BRIDGE_GATEWAY_VERIFY_URL=http://oauth-gateway:8002/internal/verify
      - AI_BRIDGE_MCP_ALLOWED_HOSTS=${AI_BRIDGE_MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,mcp-http:8001,jxiptvplayer.app:*,www.jxiptvplayer.app:*}
      - AI_BRIDGE_MCP_ALLOWED_ORIGINS=${AI_BRIDGE_MCP_ALLOWED_ORIGINS:-https://jxiptvplayer.app,https://www.jxiptvplayer.app}
    depends_on:
      - control-api
      - oauth-gateway
    volumes:
      - aibridge-data:/var/lib/ai-bridge
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8001), 3); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aibridge-network

  oauth-gateway:
    image: ai-bridge-control:production
    container_name: aibridge-oauth
    restart: always
    working_dir: /gateway
    command: ["python", "-m", "uvicorn", "gateway:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      - AI_BRIDGE_ADMIN_TOKEN=${AI_BRIDGE_ADMIN_TOKEN:?Set AI_BRIDGE_ADMIN_TOKEN in .env}
      - AI_BRIDGE_OAUTH_ISSUER=${AI_BRIDGE_OAUTH_ISSUER:-https://${AI_BRIDGE_DOMAIN:-jxiptvplayer.app}}
      - AI_BRIDGE_OAUTH_DB=/var/lib/ai-bridge/oauth/oauth.db
      - AI_BRIDGE_CONTROL_URL=http://control-api:8000
    depends_on:
      - control-api
    volumes:
      - ./deployment/oauth:/gateway:ro
      - aibridge-data:/var/lib/ai-bridge
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8002/.well-known/oauth-authorization-server > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aibridge-network

  postgres:
    image: postgres:16-alpine
    container_name: aibridge-postgres
    restart: always
    environment:
      - POSTGRES_DB=ai_bridge
      - POSTGRES_USER=ai_bridge
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - aibridge-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_bridge -d ai_bridge"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aibridge-network

  redis:
    image: redis:7-alpine
    container_name: aibridge-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    volumes:
      - aibridge-redis:/data
    networks:
      - aibridge-network

  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: aibridge-coturn
    restart: always
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    command:
      - turnserver
      - -n
      - --log-file=stdout
      - --realm=${AI_BRIDGE_DOMAIN:-jxiptvplayer.app}
      - --lt-cred-mech
      - --use-auth-secret
      # No default TURN secret (R-P0-15): compose fails fast if unset.
      # Generate one with: openssl rand -hex 32
      - --static-auth-secret=${AI_BRIDGE_TURN_SECRET:?Set AI_BRIDGE_TURN_SECRET in .env.production}
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49200
      - --fingerprint
    networks:
      - aibridge-network

  nginx:
    image: nginx:alpine
    container_name: aibridge-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_DOMAIN=${AI_BRIDGE_DOMAIN:-jxiptvplayer.app}
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-}
    volumes:
      - ./deployment/docker/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-challenge:/var/www/certbot
    command: >
      /bin/sh -c "envsubst '$$NGINX_DOMAIN $$NGINX_SERVER_NAME' < /etc/nginx/templates/default.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    depends_on:
      - control-api
      - mcp-http
    networks:
      - aibridge-network

  certbot:
    image: certbot/certbot
    container_name: aibridge-certbot
    restart: always
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-challenge:/var/www/certbot
    networks:
      - aibridge-network

volumes:
  aibridge-data:
  aibridge-pg:
  aibridge-redis:
  certbot-challenge:

networks:
  aibridge-network:
    driver: bridge

