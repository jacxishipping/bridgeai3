user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log main_json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting Zone: 30 requests per second per IP (supports real-time WebRTC signaling & agent polling)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # Upstream Control Plane (Gunicorn cluster)
    upstream control_plane {
        server control-api:8000;
        keepalive 32;
    }

    # Upstream MCP Streamable HTTP server
    upstream mcp_http {
        server mcp-http:8001;
        keepalive 16;
    }

    upstream oauth_gateway {
        server oauth-gateway:8002;
    }

    # HTTP Server: ACME challenge only (P-03). Everything else is
    # redirected to HTTPS — the API must never be served in cleartext,
    # otherwise admin tokens travel unencrypted.
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: Hardened TLS 1.3 & Reverse Proxy
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name ${NGINX_DOMAIN} www.${NGINX_DOMAIN} ${NGINX_SERVER_NAME} _;

        # TLS Certificates (managed by certbot; fallback to self-signed if missing)
        ssl_certificate /etc/letsencrypt/live/${NGINX_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${NGINX_DOMAIN}/privkey.pem;

        # Modern TLS Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: wss:; frame-ancestors 'none';" always;

        # OAuth discovery + authorization server for ChatGPT / Claude / Grok connectors
        location ~ ^/\.well-known/(oauth-protected-resource|oauth-authorization-server|openid-configuration) {
            proxy_pass http://oauth_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /oauth/ {
            proxy_pass http://oauth_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Internal OAuth verification endpoint (P-05): the location the
        # gateway README sketches, now actually shipped. `internal` means
        # it can only be reached via auth_request, never directly.
        # The gateway accepts the admin token or a valid OAuth access
        # token and answers 200/401; it returns the bound device_id in the
        # JSON body, which the MCP server reads on its own direct verify
        # call — nginx uses only the status code as the gate.
        location = /internal/verify {
            internal;
            proxy_pass http://oauth_gateway/internal/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # MCP endpoint for chatbots (Streamable HTTP, SSE-safe)
        location = /mcp {
            # P-05: authenticate at the edge via the OAuth gateway before
            # the request reaches the MCP server (defence in depth — the
            # MCP server's own bearer middleware verifies again).
            auth_request /internal/verify;
            proxy_pass http://mcp_http/mcp;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # MCP SDK DNS-rebinding protection only accepts local Host values
            proxy_set_header Host 127.0.0.1:8001;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Proxy to Control Plane API
        location / {
            limit_req zone=api_limit burst=100 nodelay;

            proxy_pass http://control_plane;
            proxy_http_version 1.1;

            # F-05-06 (Wave 6A): client-certificate fingerprint headers are
            # a trust boundary. nginx forwards unknown client headers by
            # default, so a client could spoof X-Client-Cert-Fingerprint
            # straight through to the plane. Clear all four here so only
            # the edge can ever set them — and the bundled config does NOT
            # set them: enabling AI_BRIDGE_DEVICE_MTLS=1 requires the
            # deployer to configure ssl_verify_client in this server block
            # and set X-Client-Cert-Fingerprint from the VERIFIED
            # $ssl_client_fingerprint. Until then the headers arrive empty
            # and require_device_mtls fails closed on mismatch.
            proxy_set_header X-Client-Cert-Fingerprint "";
            proxy_set_header X-SSL-Client-Fingerprint "";
            proxy_set_header X-Forwarded-Tls-Client-Cert-Info "";
            proxy_set_header X-Client-Cert "";

            # WebSocket & SSE Streaming Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering adjustments for real-time SSE & terminal streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Dedicated Prometheus metrics route (P-04): authenticated via the
        # OAuth gateway (admin token or valid OAuth access token as a
        # Bearer token) and rate-limited. Scrapers must send an
        # Authorization header; unauthenticated requests get 401.
        location /metrics {
            auth_request /internal/verify;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://control_plane/metrics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

