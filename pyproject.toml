[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bridge"
version = "0.3.0"
description = "Security-first, cross-platform AI-to-computer control platform over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.6.0,<2.0.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "psutil>=5.9",
  "httpx>=0.27",
  "websockets>=12,<18",
  "cryptography>=42.0",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# P-07 (Wave 7): production-only runtime deps, pinned exactly. These
# used to be installed unpinned in deployment/docker/Dockerfile.prod
# (`gunicorn`, `psycopg[binary]>=3.2`, `prometheus-client>=0.20`),
# outside this file. Pins: psycopg[binary]==3.3.9 is the version
# installed and tested in the repo venv (see requirements.lock);
# gunicorn==23.0.0 / prometheus-client==0.21.0 are conservative
# long-stable pins — the latest on PyPI when pinned (2026-11-17) were
# 27.0.1 / 0.26.0, but neither package is installed in the repo venv
# and the Docker image cannot be built in this VM, so the newest
# majors were NOT adopted untested. Bump only with a Docker build.
prod = ["gunicorn==23.0.0", "psycopg[binary]==3.3.9", "psycopg-pool==3.2.6", "prometheus-client==0.21.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "Pillow>=10.0"]
desktop = ["Pillow>=10.0"]
webrtc = ["aiortc>=1.8", "av>=11.0", "Pillow>=10.0", "soundcard>=0.4.2", "numpy>=1.24"]
windows = ["aiortc>=1.8", "av>=11.0", "Pillow>=10.0", "pystray>=0.19.5", "soundcard>=0.4.2", "numpy>=1.24", "comtypes>=1.2.0"]
browser = ["playwright>=1.40"]

[project.scripts]
ai-bridge = "ai_bridge.server:main"
ai-bridge-control = "ai_bridge.control.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "windows_only: tests that require a Windows host",
    "linux_only: tests that require a Linux host",
    "macos_only: tests that require a macOS host",
    "requires_api_keys: tests that require live external connector API keys",
    "requires_webrtc: tests that require optional WebRTC/aiortc extras",
    "requires_browser: tests that require optional Playwright/Chromium extras",
    "perf: wall-clock throughput or latency assertions sensitive to host load",
    "slow: long-running soak or integration tests",
]

[tool.ruff]
line-length = 200
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E702"]  # semicolon one-liners in a few compact helpers; harmless
# BLE/S/PLW security-adjacent style rules are intentionally not enforced:
# broad exception handling is deliberate in the task runner / diagnostics
# (a failed probe must never crash the server), and subprocess calls
# are argument-array only (see security review in docs/).
